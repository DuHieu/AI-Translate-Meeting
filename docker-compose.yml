services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_translate_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_translate_meeting}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_translate_meeting}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_translate_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:v1.6.0
    container_name: ai_translate_livekit
    command: --config /etc/livekit.yaml
    restart: always
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit.yaml

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: ai_translate_api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=ai_translate_meeting;Username=postgres;Password=postgres
      - Redis__ConnectionString=redis:6379
      - LiveKit__Url=ws://livekit:7880
      - LiveKit__ApiKey=devkey
      - LiveKit__ApiSecret=devsecret_aitranslate_meeting_secret_key_32chars
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: ai_translate_ai_service
    restart: always
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WHISPER_MODEL=small
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: ai_translate_web
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
