services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_translate_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_translate_meeting}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_translate_meeting}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_translate_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:v1.13.7
    container_name: ai_translate_livekit
    command:
      - --config
      - /etc/livekit.yaml
      - --keys
      - "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    restart: always
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:7880 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: ai_translate_api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Database__MigrateOnStartup=true
      - Redis__ConnectionString=redis:6379
      - LiveKit__InternalUrl=http://livekit:7880
      - LiveKit__PublicUrl=ws://127.0.0.1:7880
      - LiveKit__ApiKey=${LIVEKIT_API_KEY}
      - LiveKit__ApiSecret=${LIVEKIT_API_SECRET}
      - LiveKit__TokenTtlMinutes=${LIVEKIT_TOKEN_TTL_MINUTES:-60}
      - SubtitleToken__SigningKey=${SUBTITLE_TOKEN_SIGNING_KEY}
      - SubtitleToken__TokenTtlMinutes=${SUBTITLE_TOKEN_TTL_MINUTES:-10}
      - AdmissionToken__SigningKey=${ADMISSION_TOKEN_SIGNING_KEY}
      - AdmissionToken__HostTokenTtlMinutes=${ADMISSION_HOST_TOKEN_TTL_MINUTES:-240}
      - AdmissionToken__InviteTokenTtlMinutes=${ADMISSION_INVITE_TOKEN_TTL_MINUTES:-15}
      - AdmissionToken__RequestTokenTtlMinutes=${ADMISSION_REQUEST_TOKEN_TTL_MINUTES:-15}
      - SessionToken__SigningKey=${SESSION_TOKEN_SIGNING_KEY}
      - SessionToken__TokenTtlMinutes=${SESSION_TOKEN_TTL_MINUTES:-60}
      - Cors__AllowedOrigins__0=${WEB_ORIGIN:-http://localhost:3000}
      - Cors__AllowedOrigins__1=https://layameet.com
      - Cors__AllowedOrigins__2=https://www.layameet.com
      - License__DefaultMaxRooms=${LICENSE_MAX_ROOMS:-25}
      - License__DefaultMaxParticipants=${LICENSE_MAX_PARTICIPANTS:-20}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: ai_translate_ai_service
    restart: always
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WHISPER_MODEL=${WHISPER_MODEL:-tiny}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - WHISPER_CPU_THREADS=${WHISPER_CPU_THREADS:-4}
      - WHISPER_PRELOAD=${WHISPER_PRELOAD:-true}
      - CORS_ALLOWED_ORIGINS=${WEB_ORIGIN:-http://localhost:3000},https://layameet.com,https://www.layameet.com
      - LAYA_SERVICE_URL=http://laya:8000
      - LAYA_CONFIDENCE_THRESHOLD=0.80
      - LAYA_ENABLED=true
      - SUBTITLE_TOKEN_SIGNING_KEY=${SUBTITLE_TOKEN_SIGNING_KEY}
      - SUBTITLE_TOKEN_ISSUER=ai-translate-meeting-api
      - SUBTITLE_TOKEN_AUDIENCE=ai-translate-meeting-ai-service
      - WS_MAX_AUDIO_FRAME_BYTES=${WS_MAX_AUDIO_FRAME_BYTES:-131072}
      - WS_MAX_TEXT_FRAME_BYTES=${WS_MAX_TEXT_FRAME_BYTES:-16384}
      - CONTEXTUAL_TRANSLATION_ENABLED=${CONTEXTUAL_TRANSLATION_ENABLED:-true}
      - TRANSLATION_PROVIDER=${TRANSLATION_PROVIDER:-contextual}
      - TRANSLATION_MODEL=${TRANSLATION_MODEL:-meeting-v1}
      - TRANSLATION_TIMEOUT_MS=${TRANSLATION_TIMEOUT_MS:-3500}
      - TRANSLATION_FALLBACK_PROVIDER=${TRANSLATION_FALLBACK_PROVIDER:-local}
      - TRANSLATION_CONTEXT_MAX_SEGMENTS=${TRANSLATION_CONTEXT_MAX_SEGMENTS:-10}
      - TRANSLATION_CACHE_ENABLED=${TRANSLATION_CACHE_ENABLED:-false}
      - TRANSLATION_SECONDARY_BACKEND=${TRANSLATION_SECONDARY_BACKEND:-mymemory}
      - PRO_TRANSLATION_PROVIDER=${PRO_TRANSLATION_PROVIDER:-groq}
      - PRO_GROQ_API_KEY=${PRO_GROQ_API_KEY:-}
      - PRO_GROQ_MODEL=${PRO_GROQ_MODEL:-qwen/qwen3.8-27b}
      - PRO_DEEPSEEK_API_KEY=${PRO_DEEPSEEK_API_KEY:-}
      - PRO_DEEPSEEK_MODEL=${PRO_DEEPSEEK_MODEL:-deepseek-chat}
      - PRO_QWEN_API_KEY=${PRO_QWEN_API_KEY:-}
      - PRO_QWEN_BASE_URL=${PRO_QWEN_BASE_URL:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
      - PRO_QWEN_MODEL=${PRO_QWEN_MODEL:-qwen-mt-turbo}
      - PRO_OPENAI_API_KEY=${PRO_OPENAI_API_KEY:-}
      - PRO_OPENAI_MODEL=${PRO_OPENAI_MODEL:-gpt-4o-mini}
      - PRO_GEMINI_API_KEY=${PRO_GEMINI_API_KEY:-}
      - PRO_GEMINI_MODEL=${PRO_GEMINI_MODEL:-gemini-3.1-flash-lite}
      - PRO_DEEPL_API_KEY=${PRO_DEEPL_API_KEY:-}
      - PRO_MEETING_TOKEN_QUOTA=${PRO_MEETING_TOKEN_QUOTA:-100000}
      - PRO_GRACEFUL_DOWNGRADE_ENABLED=${PRO_GRACEFUL_DOWNGRADE_ENABLED:-true}
      - TRANSLATION_CACHE_TTL_SECONDS=${TRANSLATION_CACHE_TTL_SECONDS:-86400}
      - TRANSLATION_GLOSSARY_VERSION=${TRANSLATION_GLOSSARY_VERSION:-1.0.0}
      - LAYA_TRANSLATION_CLASSIFICATION_ENABLED=${LAYA_TRANSLATION_CLASSIFICATION_ENABLED:-true}
      - LAYA_CLASSIFICATION_TIMEOUT_MS=${LAYA_CLASSIFICATION_TIMEOUT_MS:-100}
      - TRANSLATION_DATASET_COLLECTION_ENABLED=${TRANSLATION_DATASET_COLLECTION_ENABLED:-false}
    ports:
      - "8000:8000"
    volumes:
      - whisper_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: ${AI_MODEL_START_PERIOD:-180s}
    depends_on:
      redis:
        condition: service_healthy
    # Uncomment deploy block below when NVIDIA Container Toolkit is installed to pass GPU to container:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  laya:
    image: python:3.11-slim
    container_name: ai_translate_laya
    restart: always
    command: >
      sh -c "pip install --no-cache-dir 'laya[serve]' &&
             LAYA_HOST=0.0.0.0 LAYA_PORT=8000 LAYA_DEVICE=cpu LAYA_PRELOAD=1 LAYA_MODELS=multilingual laya-serve"
    environment:
      - LAYA_HOST=0.0.0.0
      - LAYA_PORT=8000
      - LAYA_DEVICE=cpu
      - LAYA_PRELOAD=1
      - LAYA_MODELS=multilingual
    ports:
      - "8005:8000"
    volumes:
      - laya_cache:/root/.cache/huggingface

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: ai_translate_web
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
  laya_cache:
  whisper_cache:
