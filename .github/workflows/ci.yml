name: AI Translate Meeting CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-web:
    name: Build Frontend (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: |
          cd apps/web
          npm ci || npm install
      - name: Build
        run: |
          cd apps/web
          npm run build

  build-api:
    name: Build Backend API (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore dependencies
        run: dotnet restore apps/api/AITranslateMeeting.Api.csproj
      - name: Build
        run: dotnet build apps/api/AITranslateMeeting.Api.csproj --no-restore -c Release

  build-ai-service:
    name: Check AI Service (Python FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd apps/ai-service
          python -m pip install --upgrade pip
          pip install -r requirements.txt
