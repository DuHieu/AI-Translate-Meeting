[pytest]
pythonpath = apps/ai-service
# Default unit/contract suite. Production E2E lives in e2e/ and is invoked explicitly:
#   pytest e2e/ -v -m e2e
testpaths = tests apps/ai-service/tests
markers =
    e2e: production end-to-end tests requiring a live docker compose stack
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore:Using `httpx` with `starlette\.testclient` is deprecated; install `httpx2` instead\.:UserWarning:fastapi\.testclient
    ignore:.*asyncio\.(get|set)_event_loop_policy.*:DeprecationWarning:pytest_asyncio\.plugin
