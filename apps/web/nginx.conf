server {
  listen 3000;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 10M;

  include /etc/nginx/snippets/security-headers.conf;

  set $og_title "LayaMeet - Nền tảng Họp Trực Tuyến Song Ngữ AI & Dịch Đa Ngữ Thời Gian Thực";
  set $og_desc "Phá vỡ rào cản ngôn ngữ cuộc họp doanh nghiệp. Dịch song song Any-to-Any 50+ ngôn ngữ (Việt, Nhật, Anh, Trung, Thái, Lào...), độ trễ &lt;350ms, bảo mật 100% On-Premise RAM-only.";

  if ($request_uri ~* "^/(?:prejoin|join|meeting)/([A-Za-z0-9_-]+)") {
    set $room_code $1;
    set $og_title "Tham gia phòng họp $room_code · LayaMeet AI";
    set $og_desc "Nhấn để tham gia phòng họp $room_code trên LayaMeet — Hỗ trợ dịch thuật &amp; phụ đề song ngữ AI trực tiếp (Việt · Nhật · Anh).";
  }

  # Cache-Control: NEVER cache index.html so browser always loads latest bundle
  location / {
    # Nginx does not inherit server-level add_header directives when a
    # location defines its own add_header, so include the security set here.
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
    sub_filter_once off;
    sub_filter '<meta property="og:url" content="https://layameet.com/" />' '<meta property="og:url" content="$scheme://$http_host$request_uri" />';
    sub_filter 'content="https://layameet.com/og-image.png"' 'content="$scheme://$http_host/og-image.png"';
    sub_filter '<meta property="og:title" content="LayaMeet - Nền tảng Họp Trực Tuyến Song Ngữ AI & Dịch Đa Ngữ Thời Gian Thực" />' '<meta property="og:title" content="$og_title" />';
    sub_filter '<meta name="twitter:title" content="LayaMeet - Họp Trực Tuyến Song Ngữ AI Thời Gian Thực" />' '<meta name="twitter:title" content="$og_title" />';
    sub_filter '<meta property="og:description" content="Phá vỡ rào cản ngôn ngữ cuộc họp doanh nghiệp. Dịch song song Any-to-Any 50+ ngôn ngữ (Việt, Nhật, Anh, Trung, Thái, Lào...), độ trễ &lt;350ms, bảo mật 100% On-Premise RAM-only." />' '<meta property="og:description" content="$og_desc" />';
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  # Dedicated Favicon location for Googlebot-Favicon
  location = /favicon.ico {
    include /etc/nginx/snippets/security-headers.conf;
    log_not_found off;
    access_log off;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800";
  }

  # Hashed static assets can be cached
  location ^~ /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ^~ /api/glossary/ {
    proxy_pass http://ai-service:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/translation {
    proxy_pass http://ai-service:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/translation-qa {
    proxy_pass http://ai-service:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://api:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /ai-health/ {
    proxy_pass http://ai-service:8000/health/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /ai-glossary/ {
    proxy_pass http://ai-service:8000/glossary/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /ws/ {
    proxy_pass http://ai-service:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /rtc {
    proxy_pass http://livekit:7880;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /twirp/ {
    proxy_pass http://livekit:7880;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
