name: mobile
description: Laya Meet - AI-powered bilingual meeting platform for Android and iOS
publish_to: 'none'
version: 1.7.0+10700

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # WebRTC & Real-time
  livekit_client: ^2.3.4
  web_socket_channel: ^3.0.1
  
  # Networking
  dio: ^5.7.0
  
  # Local Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  
  # Permissions
  permission_handler: ^11.3.1
  
  # Code Generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  
  # Utilities
  logger: ^2.4.0
  intl: ^0.19.0
  equatable: ^2.0.5
  
  # UI Components
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  
  # Code Generation
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  
  # Testing
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  
  # Assets
  # assets:
  #   - images/
  #   - assets/
  
  # Fonts
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: fonts/Roboto-Regular.ttf
  #       - asset: fonts/Roboto-Bold.ttf
  #         weight: 700
  
  # Internationalization: hand-maintained delegates in lib/l10n/
  # Set generate: true after Flutter install if you prefer gen-l10n from ARB.
  generate: false
